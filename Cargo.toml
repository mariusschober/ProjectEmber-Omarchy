[workspace]
resolver = "2"
members = [
  "crates/ember-core",
  "crates/ember-platform",
  "crates/ember-daemon",
  "crates/ember-cli",
  "crates/ember-gui",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.92"
authors = ["Marius Schober"]
license = "MIT"
repository = "https://github.com/mariusschober/ProjectEmberLinux"

[workspace.dependencies]
ember-core = { path = "crates/ember-core" }
ember-platform = { path = "crates/ember-platform" }
ember-daemon = { path = "crates/ember-daemon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "process"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
