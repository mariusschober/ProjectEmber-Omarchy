[package]
name = "ember-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Linux display, backlight and desktop backends for Project Ember"
license.workspace = true

[dependencies]
ember-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
libc.workspace = true
chrono.workspace = true
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
sha2 = "0.10"
wayland-client = { version = "0.31", features = ["system"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols-wlr = { version = "0.3", features = ["client", "server"] }
x11rb = { version = "0.14", features = ["randr"] }

[dev-dependencies]
tempfile = "3"
wayland-server = { version = "0.31", features = ["system"] }
wayland-protocols-wlr = { version = "0.3", features = ["client", "server"] }
x11rb = { version = "0.14", features = ["randr"] }
wayland-scanner = "0.31"
